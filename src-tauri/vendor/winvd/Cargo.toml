[package]
name = "winvd"
version = "0.0.49"
authors = ["Jari Otto Oskari Pennanen"]
license = "MIT"
edition = "2021"
description = "Windows 11 virtual desktop bindings — vendored from Ciantic/VirtualDesktopAccessor with `move_desktop` exposed."

[dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_System_Com",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
] }
windows-core = { version = "0.58" }
windows-interface = { version = "0.58" }
windows-implement = { version = "0.58" }
macro_rules_attribute = "0.2"

[lib]
name = "winvd"
path = "src/lib.rs"

[features]
integration-tests = []
